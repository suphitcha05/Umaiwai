<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>บ้านรอด AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* เลย์เอาต์: คอลัมน์เดียวแบบแอปมือถือ ตัวเลขงบวันนี้คือพระเอก แท็บล่างสี่ปุ่ม */
:root {
  --bg: #EDF1EE; --surface: #FFFFFF; --surface-2: #E2E9E4; --line: #CBD6CF;
  --fg: #15201B; --muted: #56675E; --accent: #0A735C; --accent-fg: #FFFFFF; --accent-soft: #D5EBE3;
  --warn: #9A5F0C; --warn-soft: #F6E7CC; --bad: #AE3726; --bad-soft: #F7DCD6;
  --f-display: "Anuphan", "Noto Sans Thai", "Leelawadee UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1311; --surface: #151D1A; --surface-2: #1D2824; --line: #2B3833;
  --fg: #E3EBE6; --muted: #92A59B; --accent: #42C4A1; --accent-fg: #06150F; --accent-soft: #163A30;
  --warn: #E7AC52; --warn-soft: #3A2C14; --bad: #F2806B; --bad-soft: #3D1D17; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D1311; --surface: #151D1A; --surface-2: #1D2824; --line: #2B3833;
  --fg: #E3EBE6; --muted: #92A59B; --accent: #42C4A1; --accent-fg: #06150F; --accent-soft: #163A30;
  --warn: #E7AC52; --warn-soft: #3A2C14; --bad: #F2806B; --bad-soft: #3D1D17; color-scheme: dark; }

#view { display: grid; gap: 14px; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
.app { max-width: 480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(88px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 13.5px; } .bad { color: var(--bad); } .strong { font-weight: 600; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
h2 { font-size: 17px; font-weight: 600; } h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 19px; letter-spacing: .01em; }
.brand span { color: var(--accent); }
.top-r { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13.5px; }

.chip { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); letter-spacing: .02em; white-space: nowrap; }
.chip-warn { background: var(--warn-soft); color: var(--warn); }

.hero { background: var(--surface); border-radius: 20px; padding: 18px 18px 16px; display: grid; gap: 8px; border: 1px solid var(--line); }
.hero-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.eyebrow { font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.big { font-family: var(--f-display); font-weight: 700; font-size: clamp(52px, 17vw, 76px); line-height: 1.05; color: var(--accent); letter-spacing: -.01em; }
.hero.is-over .big { color: var(--bad); }
.hero-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; }
.bar { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.hero.is-over .bar span, .bar.over span { background: var(--bad); }
.bar.thin { height: 6px; }

.why { background: var(--accent-soft); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 6px; }
.why h2 { font-size: 14px; color: var(--accent); letter-spacing: .02em; }
.block { display: grid; gap: 10px; padding: 4px 2px; }
.block + .block { border-top: 1px solid var(--line); padding-top: 16px; }
.h-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

ul { list-style: none; margin: 0; padding: 0; }
.cats { display: grid; gap: 10px; }
.cat-line { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 4px; }
.tx, .shops { display: grid; }
.tx li, .shops li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.tx li > div:first-child, .shops li > div:first-child { min-width: 0; display: grid; }
.tx strong, .shops strong { font-weight: 500; overflow-wrap: anywhere; }
.sub { font-size: 13px; color: var(--muted); }
.src-sample { color: var(--warn); font-weight: 600; }
.tx-r { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.empty { color: var(--muted); padding: 8px 0; }
.fixed { display: grid; gap: 6px; }
.fixed li { display: flex; justify-content: space-between; gap: 8px; }
.fixed label { display: flex; gap: 8px; align-items: center; }
.debt { font-size: 14px; color: var(--warn); }
.ledger dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin: 0; font-size: 14.5px; }
.ledger dt { color: var(--muted); } .ledger dt.strong { color: var(--fg); } .ledger dd { margin: 0; text-align: right; }
.demo { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 14px; }
.block.demo + .block, .block + .block.demo { border-top: 1px dashed var(--line); }

.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
.grow { flex: 1 1 160px; }
.btn { font: 600 15px var(--f-body); border: 0; border-radius: 12px; padding: 11px 16px; background: var(--accent); color: var(--accent-fg); cursor: pointer; min-height: 44px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn-ghost { background: var(--surface-2); color: var(--fg); }
.btn-small { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn-link { background: none; color: var(--accent); padding: 4px 0; min-height: 0; text-decoration: underline; text-underline-offset: 3px; justify-self: start; }
.icon-btn { font: 500 13px var(--f-body); background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 4px 8px; cursor: pointer; }
.icon-btn:disabled { opacity: .35; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
input, select { font: 16px var(--f-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; width: 100%; box-sizing: border-box; }
input[type="checkbox"], input[type="radio"] { width: 20px; height: 20px; accent-color: var(--accent); padding: 0; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; }
legend { font-family: var(--f-display); font-weight: 600; font-size: 15px; padding: 0; margin-bottom: 8px; color: var(--fg); }
.settings { gap: 22px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 400px) { .grid3 { grid-template-columns: 1fr 1fr; } }
.seg { display: grid; gap: 6px; }
.seg label { display: flex; align-items: center; gap: 8px; color: var(--fg); font-size: 15px; }
.fx-row { display: grid; grid-template-columns: 1fr 110px auto; gap: 8px; align-items: center; margin-bottom: 8px; }
.cat-head, .cat-row { display: grid; grid-template-columns: 1fr 88px 70px 64px; gap: 8px; align-items: center; }
.cat-row > span:first-child { font-size: 15px; }
.ord { display: flex; gap: 4px; }

.drop { display: grid; place-items: center; gap: 4px; padding: 28px 16px; border: 2px dashed var(--accent); border-radius: 18px; background: var(--accent-soft); cursor: pointer; text-align: center; }
.drop-title { font-family: var(--f-display); font-weight: 700; font-size: 20px; color: var(--accent); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.samples { display: grid; gap: 8px; }
.samples .btn { text-align: left; font-weight: 500; }
.status { color: var(--accent); font-weight: 600; min-height: 1.2em; }
.note { background: var(--warn-soft); color: var(--warn); padding: 10px 12px; border-radius: 10px; font-size: 14px; }
.remember { background: var(--accent-soft); color: var(--accent); padding: 10px 12px; border-radius: 10px; font-size: 14px; font-weight: 500; }
.first-note { background: var(--warn-soft); padding: 10px 12px; border-radius: 10px; color: var(--warn); font-weight: 600; }
.review { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }

.picks { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.picks > span { flex-basis: 100%; }
.pick-chip { font: 500 14px var(--f-body); background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; cursor: pointer; max-width: 100%; overflow-wrap: anywhere; text-align: left; }
.raw summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.raw pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; background: var(--surface-2); padding: 10px; border-radius: 8px; max-height: 240px; overflow: auto; }
.memo-line { font-size: 14px; color: var(--accent); font-weight: 500; }
.reason { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; font-size: 14px; }
.reason .muted { margin-right: 4px; }
.reason.conf-low { background: var(--warn-soft); }
.in { color: var(--accent); font-weight: 600; }
.rules summary { cursor: pointer; color: var(--accent); font-weight: 600; }
.rules ol { margin: 8px 0 0; padding-left: 22px; display: grid; gap: 8px; font-size: 14px; }
.rules .sub { display: block; overflow-wrap: anywhere; }
.tests { display: grid; gap: 6px; font-size: 14px; }
.tests span { font-weight: 600; display: inline-block; min-width: 56px; }
.tests .pass span { color: var(--accent); } .tests .fail span { color: var(--bad); }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); z-index: 5; }
.tabs-in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabs button { font: 600 14px var(--f-body); background: none; border: 0; color: var(--muted); padding: 14px 4px; cursor: pointer; border-top: 3px solid transparent; }
.tabs button[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand">บ้านรอด <span>AI</span></div>
    <div class="top-r"><span id="date-line" class="num"></span><span id="sample-chip" class="chip chip-warn">ข้อมูลตัวอย่าง</span></div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="เมนูหลัก"><div class="tabs-in">
  <button data-tab="today">วันนี้</button><button data-tab="add">เพิ่มสลิป</button><button data-tab="shops">ร้านที่จำ</button><button data-tab="settings">ตั้งค่า</button>
</div></nav>
<script>/* บ้านรอด AI — ชุดกฎจัดหมวดจากสลิป
   อ่าน 3 ช่อง: ผู้ส่ง, ผู้รับ/ร้าน, บันทึกช่วยจำ
   ลำดับการตัดสิน (ข้อแรกที่เข้าได้ชนะ):
     1. ทิศทางเงินจากชื่อผู้ส่ง/ผู้รับเทียบกับชื่อเจ้าของ → โอนระหว่างบัญชีตัวเอง / รายรับ
     2. บันทึกช่วยจำที่ระบุหมวดตรงๆ (เช่น "ค่ากิน", "#เดินทาง")
     3. บันทึกช่วยจำที่เข้ากฎคำหลัก
     4. ร้านที่ผู้ใช้เคยสอนแอปไว้ (ความจำร้าน / ชื่อที่เคยแก้ / เลขบัญชี)
     5. ชื่อร้านที่เข้ากฎคำหลัก (ข้ามถ้าผู้รับเป็นบุคคล เพราะชื่อคนมักชนคำหลัก)
     6. ผู้รับเป็นบุคคลและไม่มีบันทึกช่วยจำ → อื่นๆ ให้ผู้ใช้เลือก
     7. ไม่เข้ากฎใดเลย → อื่นๆ ให้ผู้ใช้เลือก
   เพิ่มกฎได้ที่ RULES: กฎบนชนะกฎล่าง คำภาษาอังกฤษจับเป็นคำทั้งคำ คำไทยจับเป็นส่วนของข้อความ */
(function (root) {
  const R = (id, cat, label, terms, extra) => ({ id, cat, label, terms, extra: extra || null });

  // หมวดที่ผู้ใช้พิมพ์ชื่อตรงๆ ในบันทึกช่วยจำ
  const EXPLICIT = [
    ['food', ['ค่ากิน', 'ค่าอาหาร', '#กิน', '#อาหาร']],
    ['coffee', ['กาแฟ', '#กาแฟ', 'ค่ากาแฟ']],
    ['travel', ['เดินทาง', 'ค่าเดินทาง', '#เดินทาง']],
    ['shop', ['ช้อปปิ้ง', '#ช้อป', '#ช้อปปิ้ง']],
    ['fixed', ['ค่าคงที่', '#คงที่', '#บิล']],
    ['transfer', ['#ออม', '#โอนตัวเอง', 'ไม่นับ']],
    ['other', ['อื่นๆ', '#อื่น']],
  ];

  const RULES = [
    // --- ไม่นับเป็นรายจ่าย ---
    R('saving', 'transfer', 'ออม/ลงทุน', ['ออมเงิน', 'เงินออม', 'เก็บเงิน', 'ฝากเงิน', 'ฝากประจำ', 'บัญชีตัวเอง', 'บัญชีออม', 'saving', 'savings', 'ลงทุน', 'กองทุน', 'ซื้อหุ้น', 'ออมทอง', 'ซื้อทอง', 'dime', 'finnomena', 'bitkub', 'binance', 'คริปโต', 'crypto']),
    R('lend', 'transfer', 'ยืม/คืนเงิน', ['ให้ยืม', 'ยืมเงิน', 'คืนเงิน', 'ใช้หนี้', 'คืนหนี้', 'ผ่อนเพื่อน']),
    R('wallet', 'transfer', 'เติมกระเป๋าเงิน', ['truemoney', 'true money', 'ทรูมันนี่', 'ทรูมันนี', 'rabbit line pay', 'แรบบิทไลน์เพย์', 'เป๋าตัง', 'paotang', 'เติมวอลเล็ท', 'เติม wallet']),
    R('family', 'other', 'ส่งเงินให้ครอบครัว', ['ให้แม่', 'ให้พ่อ', 'ส่งเงินให้', 'เงินให้ที่บ้าน', 'ค่าใช้จ่ายบ้าน', 'ค่าขนมลูก', 'ค่าขนมน้อง']),

    // --- ค่ากิน / กาแฟ ---
    R('delivery', 'food', 'สั่งอาหารเดลิเวอรี', ['grabfood', 'grab food', 'แกร็บฟู้ด', 'line man', 'lineman', 'ไลน์แมน', 'foodpanda', 'ฟู้ดแพนด้า', 'robinhood', 'โรบินฮู้ด', 'shopeefood', 'shopee food', 'ช้อปปี้ฟู้ด']),
    R('cafe', 'coffee', 'ร้านกาแฟ/ชา', ['กาแฟ', 'coffee', 'cafe', 'café', 'คาเฟ่', 'amazon', 'อเมซอน', 'starbucks', 'สตาร์บัคส์', 'inthanin', 'อินทนิล', 'black canyon', 'แบล็คแคนยอน', 'doi chaang', 'ดอยช้าง', 'wawee', 'วาวี', 'punthai', 'พันธุ์ไทย', 'chao doi', 'ชาวดอย', 'arabica', 'kudsan', 'ชานม', 'ชาไทย', 'ชาเขียว', 'ชาไข่มุก', 'ไข่มุก', 'bubble tea', 'boba', 'ชาตรามือ', 'cha tra mue', 'tiger sugar', 'koi', 'mixue', 'มิกซ์เซ่อ', 'tea']),
    R('restaurant', 'food', 'ร้านอาหาร/ของกิน', ['ค่าข้าว', 'ข้าว', 'กิน', 'อาหาร', 'มื้อ', 'กับข้าว', 'ก๋วยเตี๋ยว', 'ตามสั่ง', 'ส้มตำ', 'หมูกระทะ', 'ชาบู', 'สุกี้', 'โจ๊ก', 'บะหมี่', 'ราเมง', 'ซูชิ', 'หมูปิ้ง', 'ไก่ทอด', 'ไก่ย่าง', 'ข้าวมันไก่', 'ข้าวขาหมู', 'ผัดไทย', 'ขนม', 'ผลไม้', 'น้ำดื่ม', 'น้ำแข็ง', 'ของสด', 'ตลาดสด', 'ครัว', 'food', 'meal', 'lunch', 'dinner', 'breakfast', 'restaurant', 'kitchen', 'mk', 'เอ็มเค', 'fuji', 'ฟูจิ', 'yayoi', 'ยาโยอิ', 'sizzler', 'ซิซซ์เลอร์', 'kfc', 'เคเอฟซี', "mcdonald's", 'mcdonalds', 'แมคโดนัลด์', 'burger king', 'เบอร์เกอร์คิง', 'pizza', 'พิซซ่า', "swensen's", 'สเวนเซ่นส์', 'dairy queen', 'bonchon', 'บอนชอน', 'shabushi', 'ชาบูชิ', 'bar b q plaza', 'บาร์บีคิวพลาซ่า', 'สุกี้ตี๋น้อย', 'after you', 'อาฟเตอร์ยู', 's&p', "chester's", 'เชสเตอร์', 'texas chicken', 'subway', 'sukishi', 'โอ้กะจู๋', 'zen', 'hachiban', 'ฮะจิบัง', 'yoshinoya', 'โยชิโนยะ']),
    R('grocery', 'food', 'สะดวกซื้อ/ซูเปอร์ฯ (ส่วนใหญ่ของกิน)', ['7-eleven', '7-11', 'seven eleven', 'เซเว่น', 'familymart', 'family mart', 'แฟมิลี่มาร์ท', "lotus's", 'lotus', 'โลตัส', 'big c', 'บิ๊กซี', 'tops', 'ท็อปส์', 'makro', 'แม็คโคร', 'villa market', 'gourmet market', 'กูร์เมต์', 'cj express', 'ซีเจ', 'foodland', 'ฟู้ดแลนด์', 'maxvalu', 'แม็กซ์แวลู', 'lawson', 'ลอว์สัน', 'ร้านขายของชำ', 'ร้านชำ', 'มินิมาร์ท', 'minimart'], { conf: 'mid' }),

    // --- เดินทาง ---

/* บ้านรอด AI — เครื่องคำนวณงบ (กติกาสโคป 3) + ตัวอ่านข้อความสลิป

(function (root) {
  const floor = Math.floor;
  const num = v => (Number.isFinite(+v) ? +v : 0);
  const sum = a => a.reduce((x, y) => x + num(y), 0);

  function incomeBase(s) { return s.mode === 'careful' ? num(s.incomeMin) : num(s.incomeNormal); }
  function debtMin(s) { return num((s.debt || {}).minPay); }

  function fixedTotal(s) { return sum((s.fixed || []).map(f => f.amount)) + debtMin(s); }
  function monthPot(s, income) { return income - fixedTotal(s) - num(s.reserve); }
  function monthlyInterest(s) { const d = s.debt || {}; return floor(num(d.balance) * num(d.apr) / 100 / 12); }

  // กติกา 1: แบ่ง B ตามสัดส่วน ปัดลง เศษให้หมวดที่ลดทีหลังสุด (ตัวสุดท้ายในลำดับ)

    if (cats.length) out[cats.length - 1] += B - sum(out);

  function replay(s, data, todayIdx) {
    const days = Math.max(1, num(s.days));
    const n = Math.min(Math.max(todayIdx, 0), days - 1);
    let income = incomeBase(s);
    let M = monthPot(s, income);
    let B = floor(M / days);
    let D = 0, bucket = 0, carry = 0, spent = 0;
    const hist = [];
    for (let d = 0; d <= n; d++) {
      const notes = [];
      const evs = (data.incomes || []).filter(e => e.day === d);
      if (evs.length) { // กติกา 5
        income = num(evs[evs.length - 1].amount);

        B = floor((M - spent - bucket) / (days - d));
        D = 0; carry = 0;

  const MEMO_RE = /^(บันทึกช่วยจำ|บันทึก|memo|note|หมายเหตุ)\s*[:：]?\s*(.*)$/i;

  }

    for (let i = 0; i < lines.length; i++) {
      const m = lines[i].match(/^(จาก|from|ผู้โอน|ผู้ส่ง|ผู้ชำระ)\s*[:：]?\s*(.*)$/i);
      if (m) { const v = m[2].trim() || (lines[i + 1] || '').trim(); if (v && !BANK_RE.test(v) && !ACCT_RE.test(v)) return cleanName(v); }

  // ร้านเดิมเปลี่ยนเลขบัญชี → เจอจากชื่อ; ชื่ออ่านเพี้ยน → เจอจากเลขบัญชี; บัญชีตัวกลางหลายร้าน → ชื่อชนะ
  // อ่านชื่อได้แต่ไม่รู้จัก = ร้านใหม่ เลขบัญชีที่ตรงกับร้านเก่าเป็นแค่ข้อเสนอ (suggest) ให้ผู้ใช้กดยืนยัน

  function findShop(shops, aliases, name, acct) {
    const k0 = shopKey(name);
    if (k0 && shops[k0]) return { key: k0, via: '' };

  // เดาว่าสลิปค่าคงที่นี้คือรายการไหนในค่าคงที่ที่ตั้งไว้ (กฎกลุ่มเดียวกัน)
  function fixedGuess(cls) {
    if (cls.cat !== 'fixed') return '';
    if (cls.rule === 'debt' && n(S.settings.debt.minPay) > 0) return 'debt';
    const i = S.settings.fixed.findIndex(f => { const m = E.Rules.matchRule(f.name); return m && m.id === cls.rule; });
    return i >= 0 ? String(i) : '';
  }
  function openDraft(p, source, msg) {
    const k0 = E.shopKey(p.shop);
    const hit = E.findShop(S.shops, S.aliases, p.shop, p.acct);
    const known = S.shops[hit.key];
    if (known) p.shop = known.name;
    const idx = todayIdx();
    let day = idx;
    if (p.date) { const di = diffDays(S.settings.startDate, p.date); if (di <= idx) day = di; }
    const cls = E.classify({ sender: p.sender, shop: p.shop, memo: p.memo, owners: S.settings.owners, memory: known });
    draft = {
      amount: p.amount ?? '', shop: p.shop || '', day, source,
      cat: cls.cat, cls, sender: p.sender || '',
      memo: p.memo || '', note: p.memo || '', known: !!known, fixedIdx: fixedGuess(cls), msg: msg || '',
      orig: { amount: p.amount, shop: p.shop, readShop: k0 }, acct: p.acct || '',
      candidates: (p.candidates || []).filter(c => c !== p.shop), raw: p.raw || '', via: known ? hit.via : '', suggest: !known && hit.suggest ? hit.suggest : '',
    };
    flash = '';
    tab = 'add';
    render();
  }

  }

      <ul class="tests">${runTests().map(x => `<li class="${x.ok ? 'pass' : 'fail'}"><span>${x.ok ? 'ผ่าน' : 'ไม่ผ่าน'}</span> ${esc(x.name)}</li>`).join('')}</ul>
    </section>
    <section class="block">
      <h2>ข้อมูลในเครื่องนี้</h2>
      <p class="muted small">เก็บในเบราว์เซอร์นี้เท่านั้น ไม่มีบัญชีผู้ใช้</p>
      <div class="row"><button class="btn btn-ghost" data-act="reset-sample">โหลดข้อมูลตัวอย่างใหม่</button><button class="btn btn-ghost" data-act="clear-all">เริ่มใหม่แบบว่าง</button></div>
    </section>`;
  }

  function runTests() {
    const base = () => ({ incomeNormal: 20000, incomeMin: 15000, mode: 'normal', reserve: 2000, days: 30, leftoverMode: 'bucket',
      fixed: [{ amount: 8000 }], debt: { minPay: 0 },
      cats: [{ id: 'shop', weight: 83, cap: 1 }, { id: 'coffee', weight: 50, cap: .5 }, { id: 'food', weight: 200, cap: .5 }] });
    const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
    const res = [];
    const T = (name, fn) => { let ok = false; try { ok = fn(); } catch (e) {} res.push({ name, ok }); };
    const sumA = a => a.reduce((x, y) => x + y, 0);
    const rs = [];
    T('T1 งบวันแรก B = 333, หมวด 83/50/200', () => { const r = E.replay(base(), { txns: [] }, 0); rs.push(r); return r.today.B === 333 && eq(r.today.cb, [83, 50, 200]); });
    T('T2 ใช้เกิน 100 → วันที่ 2 งบ 233', () => { const r = E.replay(base(), { txns: [{ day: 0, amount: 433, cat: 'food' }] }, 1); rs.push(r); return r.today.T === 233 && eq(r.today.red, [83, 17, 0]); });
    T('T3 ใช้เหลือ 100 → ถังสำรอง 100', () => { const r = E.replay(base(), { txns: [{ day: 0, amount: 233, cat: 'food' }] }, 1); rs.push(r); return r.bucket === 100 && r.today.T === 333; });
    T('T4 รายได้เป็น 17,000 วันที่ 10 → B = 190', () => { const tx = []; for (let d = 0; d < 9; d++) tx.push({ day: d, amount: 333, cat: 'food' }); const r = E.replay(base(), { txns: tx, incomes: [{ day: 9, amount: 17000 }] }, 9); rs.push(r); return r.today.B === 190 && r.D === 0; });
    T('T12 ขั้นต่ำบัตร 1,500 → B = 283, หมวด 70/42/171', () => { const s = base(); s.debt.minPay = 1500; const r = E.replay(s, { txns: [] }, 0); rs.push(r); return r.today.B === 283 && eq(r.today.cb, [70, 42, 171]); });
    T('T8 ผลรวมหมวดเท่ากับงบวันนี้ทุกวัน', () => rs.every(r => r.hist.every(h => sumA(h.catT) === h.T)));
    return res;
  }

  /* ---------- OCR (Tesseract.js บนเครื่อง) ---------- */
  let worker = null;
  function loadScript(src) {
    return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('load')); document.head.appendChild(s); });
  }
  const timeout = (p, ms) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error('timeout')), ms))]);
  async function getWorker() {
    if (!window.Tesseract) await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
    if (!worker) worker = await window.Tesseract.createWorker('tha+eng');
    return worker;
  }
  function setStatus(t) { flash = t; const el = $('#ocr-status'); if (el) el.textContent = t; }
  async function readSlip(file) {
    setStatus('กำลังอ่านสลิปบนเครื่องนี้…');
    try {
      const w = await timeout(getWorker(), 60000);
      const { data } = await timeout(w.recognize(file), 45000);
      const p = E.parseSlip(data.text);
      const miss = [p.amount == null && 'ยอด', !p.shop && 'ร้าน'].filter(Boolean);
      openDraft(p, 'slip', miss.length ? `อ่าน${miss.join('และ')}ไม่ได้ กรอกเองได้เลย` : 'อ่านจากสลิปแล้ว ตรวจตัวเลขก่อนบันทึก');
    } catch (e) {
      openDraft({}, 'slip', 'อ่านอัตโนมัติไม่ได้บนหน้านี้ กรอกยอดและร้านเองได้ (OCR ทำงานเมื่อเปิดแอปจากเว็บที่โฮสต์เอง)');
    }
  }

  /* ---------- การกระทำ ---------- */
  const uid = () => Math.random().toString(36).slice(2, 9);
  function act(a, el) {
    const s = S.settings;
    switch (a) {
      case 'go-add': tab = 'add'; break;
      case 'del-tx': S.txns = S.txns.filter(x => x.id !== el.dataset.id); break;
      case 'paid': s.fixed[+el.dataset.i].paid = el.checked; break;
      case 'paid-debt': s.debt.paid = el.checked; break;
      case 'cover': S.covers.push({ day: todayIdx() }); break;
      case 'next-day': S.offset = n(S.offset) + 1; break;
      case 'prev-day': S.offset = n(S.offset) - 1; break;
      case 'clear-income': S.incomes = []; break;
      case 'use-income': { const v = S.txns.filter(x => x.cat === 'income' && x.day >= 0 && x.day <= todayIdx()).reduce((a, x) => a + n(x.amount), 0); S.incomes = S.incomes.filter(e => e.day !== todayIdx()); S.incomes.push({ day: todayIdx(), amount: v }); break; }
      case 'manual': openDraft({}, 'manual'); return;
      case 'sample-slip': { const x = sampleSlips()[+el.dataset.i]; openDraft(E.parseSlip(x.text), 'sample', 'สลิปตัวอย่าง ผ่านตัวแยกยอด/ร้าน/วันที่เดียวกับ OCR'); return; }
      case 'warm-ocr': setStatus('กำลังเตรียม OCR…'); timeout(getWorker(), 60000).then(() => setStatus('OCR พร้อมแล้ว'), () => setStatus('โหลด OCR ไม่ได้บนหน้านี้ ใช้สลิปตัวอย่างหรือพิมพ์เองแทน')); return;
      case 'cancel-draft': draft = null; break;
      case 'use-suggest': {
        const f = el.form; draft.amount = f.elements.amount.value;
        const sh = S.shops[draft.suggest]; if (!sh) return;
        draft.shop = sh.name; draft.known = true; draft.via = 'acct'; draft.suggest = '';
        draft.cls = E.classify({ sender: draft.sender, shop: sh.name, memo: draft.memo, owners: S.settings.owners, memory: sh });
        draft.cat = draft.cls.cat; render(); return;
      }
      case 'pick-shop': {
        const f = el.form; draft.amount = f.elements.amount.value; if (f.elements.note) draft.note = f.elements.note.value;
        const c = draft.candidates[+el.dataset.i];
        draft.candidates = draft.candidates.filter(x => x !== c).concat(draft.shop ? [draft.shop] : []);
        draft.shop = c;
        const k = S.aliases[E.shopKey(c)] || E.shopKey(c);
        draft.cls = E.classify({ sender: draft.sender, shop: c, memo: draft.memo, owners: S.settings.owners, memory: S.shops[k] || null });
        draft.cat = draft.cls.cat;
        if (S.shops[k]) draft.shop = S.shops[k].name;
        render(); return;
      }
      case 'copy-raw': {
        const pre = el.parentElement.querySelector('pre');
        const sel = () => { const r = document.createRange(); r.selectNodeContents(pre); const s2 = window.getSelection(); s2.removeAllRanges(); s2.addRange(r); };
        try { navigator.clipboard.writeText(draft.raw).then(() => { el.textContent = 'คัดลอกแล้ว'; }, sel); } catch (e) { sel(); }
        return;
      }
      case 'shop-cat': S.shops[el.dataset.k].cat = el.value; break;
      case 'clear-aliases': S.aliases = {}; flash = ''; break;
      case 'del-shop': { const k = el.dataset.k; delete S.shops[k]; Object.keys(S.aliases).forEach(x => { if (x !== '__shared' && S.aliases[x] === k) delete S.aliases[x]; }); break; }
      case 'fx-add': syncSettings(); s.fixed.push({ name: 'รายการใหม่', amount: 0, paid: false }); break;
      case 'fx-del': syncSettings(); s.fixed.splice(+el.dataset.i, 1); break;
      case 'cat-up': case 'cat-down': { syncSettings(); const i = +el.dataset.i, j = a === 'cat-up' ? i - 1 : i + 1; [s.cats[i], s.cats[j]] = [s.cats[j], s.cats[i]]; break; }
      case 'reset-sample': S = sampleState(); flash = 'โหลดข้อมูลตัวอย่างแล้ว'; break;
      case 'clear-all': { const st = sampleState(); st.sample = false; st.txns = []; st.shops = {}; st.settings.fixed.forEach(f => f.paid = false); S = st; tab = 'settings'; flash = 'ล้างรายการแล้ว ตั้งค่าของคุณเองได้เลย'; break; }
      default: return;
    }
    save(); render();
  }
  function syncSettings() {
    const form = document.querySelector('[data-form="settings"]');
    if (!form) return;
    const fd = new FormData(form), s = S.settings, g = k => fd.get(k);
    s.incomeMin = n(g('incomeMin')); s.incomeNormal = n(g('incomeNormal'));
    s.mode = g('mode') || 'normal'; s.leftoverMode = g('leftoverMode') || 'bucket';
    s.fixed.forEach((x, i) => { if (fd.has('fxn-' + i)) { x.name = g('fxn-' + i); x.amount = n(g('fxa-' + i)); } });
    s.debt.balance = n(g('debtBalance')); s.debt.minPay = n(g('debtMin')); s.debt.apr = n(g('debtApr'));
    s.owners = String(g('owners') || '').split(/[,،\n]/).map(x => x.trim()).filter(Boolean);
    s.reserve = n(g('reserve')); s.days = Math.min(31, Math.max(1, n(g('days')) || 30));
    if (g('startDate')) s.startDate = g('startDate');
    s.cats.forEach(c => { c.weight = n(g('cw-' + c.id)); c.cap = Math.min(100, n(g('cc-' + c.id))) / 100; });
  }
  function submit(kind, form) {
    if (kind === 'income') {
      const v = n(form.querySelector('#inc-real').value);
      S.incomes = S.incomes.filter(e => e.day !== todayIdx()); S.incomes.push({ day: todayIdx(), amount: v });
    } else if (kind === 'settings') {
      syncSettings(); S.sample = false; S.offset = 0; S.incomes = []; S.covers = [];
      flash = 'บันทึกแล้ว งบคำนวณใหม่';
    } else if (kind === 'review') {
      const fd = new FormData(form);
      const amount = Math.round(n(fd.get('amount')) * 100) / 100, shop = String(fd.get('shop')).trim(), cat = fd.get('cat');
      const key = E.shopKey(shop);
      const ownerKeys = (S.settings.owners || []).map(E.shopKey);
      // ไม่สร้างทางลัดจากชื่อของผู้ใช้เอง (มักเป็นผู้ส่งที่ตัวอ่านหยิบผิด)
      if (draft.orig.readShop && !ownerKeys.includes(draft.orig.readShop) && !E.Rules.isOwner(draft.orig.shop, S.settings.owners)) E.learnAlias(S.aliases, draft.orig.readShop, key);
      if (draft.acct) E.learnAlias(S.aliases, 'acct:' + draft.acct, key);
      if (!S.shops[key]) S.shops[key] = { name: shop, cat, note: String(fd.get('note') || '').trim(), created: isoToday() };
      else S.shops[key].cat = cat;
      const fx = fd.get('fixedIdx');
      if (cat === 'fixed' && fx === 'debt') S.settings.debt.paid = true;
      else if (cat === 'fixed' && fx !== null && fx !== '') S.settings.fixed[+fx].paid = true;
      const edited = draft.source === 'slip' && (draft.orig.amount !== amount || draft.orig.shop !== shop);
      S.txns.push({ id: uid(), day: draft.day, amount, shop, cat, source: draft.source, edited, memo: draft.memo || '' });
      draft = null; tab = 'today';
    }
    save(); render();
  }

  /* ---------- วาดหน้า ---------- */
  const TABS = [['today', 'วันนี้'], ['add', 'เพิ่มสลิป'], ['shops', 'ร้านที่จำ'], ['settings', 'ตั้งค่า']];
  function render() {
    const views = { today: viewToday, add: viewAdd, shops: viewShops, settings: viewSettings };
    $('#view').innerHTML = views[tab]();
    $('#date-line').textContent = `${thDate(dayDate(Math.max(0, Math.min(todayIdx(), S.settings.days - 1))))} · วันที่ ${Math.min(Math.max(todayIdx(), 0), S.settings.days - 1) + 1}/${S.settings.days}`;
    $('#sample-chip').hidden = !S.sample;
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  }
  document.addEventListener('click', e => {
    const tb = e.target.closest('.tabs button');
    if (tb) { tab = tb.dataset.tab; if (tab !== 'add') draft = null; flash = ''; render(); window.scrollTo(0, 0); return; }
    const el = e.target.closest('[data-act]');
    if (el && el.tagName !== 'SELECT' && el.type !== 'checkbox' && el.type !== 'file') { e.preventDefault(); act(el.dataset.act, el); }
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.act === 'file' && el.files && el.files[0]) { readSlip(el.files[0]); el.value = ''; return; }
    if (el.name === 'cat' && draft) { draft.cat = el.value; const f = el.form; draft.amount = f.elements.amount.value; draft.shop = f.elements.shop.value; if (f.elements.note) draft.note = f.elements.note.value; render(); return; }
    if (el.dataset.act && (el.tagName === 'SELECT' || el.type === 'checkbox')) act(el.dataset.act, el);
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (draft && el.name === 'note' && !draft.known) {
      draft.note = el.value;
      const g = E.guessCat(el.value + ' ' + el.form.elements.shop.value);
      if (g !== 'other') { el.form.elements.cat.value = g; draft.cat = g; }
    }
  });
  document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (f) { e.preventDefault(); submit(f.dataset.form, f); } });
  render();
})();
</script>
