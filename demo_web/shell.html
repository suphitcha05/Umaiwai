<title>MePlan AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* เลย์เอาต์: คอลัมน์เดียวแบบแอปมือถือ ตัวเลขงบวันนี้คือพระเอก แท็บล่างสี่ปุ่ม */
:root {
  --bg: #EDF1EE; --surface: #FFFFFF; --surface-2: #E2E9E4; --line: #CBD6CF;
  --fg: #15201B; --muted: #56675E; --accent: #0A735C; --accent-fg: #FFFFFF; --accent-soft: #D5EBE3;
  --warn: #9A5F0C; --warn-soft: #F6E7CC; --bad: #AE3726; --bad-soft: #F7DCD6;
  --f-display: "Anuphan", "Noto Sans Thai", "Leelawadee UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1311; --surface: #151D1A; --surface-2: #1D2824; --line: #2B3833;
  --fg: #E3EBE6; --muted: #92A59B; --accent: #42C4A1; --accent-fg: #06150F; --accent-soft: #163A30;
  --warn: #E7AC52; --warn-soft: #3A2C14; --bad: #F2806B; --bad-soft: #3D1D17; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D1311; --surface: #151D1A; --surface-2: #1D2824; --line: #2B3833;
  --fg: #E3EBE6; --muted: #92A59B; --accent: #42C4A1; --accent-fg: #06150F; --accent-soft: #163A30;
  --warn: #E7AC52; --warn-soft: #3A2C14; --bad: #F2806B; --bad-soft: #3D1D17; color-scheme: dark; }

#view { display: grid; gap: 14px; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
.app { max-width: 480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(88px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 13.5px; } .bad { color: var(--bad); } .strong { font-weight: 600; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
h2 { font-size: 17px; font-weight: 600; } h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 19px; letter-spacing: .01em; }
.brand span { color: var(--accent); font-size: 12px; font-weight: 600; letter-spacing: .04em; margin-left: 4px; }
.top-r { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13.5px; }

.chip { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); letter-spacing: .02em; white-space: nowrap; }
.chip-warn { background: var(--warn-soft); color: var(--warn); }

.hero { background: var(--surface); border-radius: 20px; padding: 18px 18px 16px; display: grid; gap: 8px; border: 1px solid var(--line); }
.hero-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.eyebrow { font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.big { font-family: var(--f-display); font-weight: 700; font-size: clamp(52px, 17vw, 76px); line-height: 1.05; color: var(--accent); letter-spacing: -.01em; }
.hero.is-over .big { color: var(--bad); }
.hero-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; }
.bar { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.hero.is-over .bar span, .bar.over span { background: var(--bad); }
.bar.thin { height: 6px; }

.why { background: var(--accent-soft); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 6px; }
.why h2 { font-size: 14px; color: var(--accent); letter-spacing: .02em; }
.block { display: grid; gap: 10px; padding: 4px 2px; }
.block + .block { border-top: 1px solid var(--line); padding-top: 16px; }
.h-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

ul { list-style: none; margin: 0; padding: 0; }
.cats { display: grid; gap: 10px; }
.cat-line { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 4px; }
.tx, .shops { display: grid; }
.tx li, .shops li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.tx li > div:first-child, .shops li > div:first-child { min-width: 0; display: grid; }
.tx strong, .shops strong { font-weight: 500; overflow-wrap: anywhere; }
.sub { font-size: 13px; color: var(--muted); }
.src-sample { color: var(--warn); font-weight: 600; }
.tx-r { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.empty { color: var(--muted); padding: 8px 0; }
.fixed { display: grid; gap: 6px; }
.fixed li { display: flex; justify-content: space-between; gap: 8px; }
.fixed label { display: flex; gap: 8px; align-items: center; }
.debt { font-size: 14px; color: var(--warn); }
.ledger dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin: 0; font-size: 14.5px; }
.ledger dt { color: var(--muted); } .ledger dt.strong { color: var(--fg); } .ledger dd { margin: 0; text-align: right; }
.demo { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 14px; }
.block.demo + .block, .block + .block.demo { border-top: 1px dashed var(--line); }

.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
.grow { flex: 1 1 160px; }
.btn { font: 600 15px var(--f-body); border: 0; border-radius: 12px; padding: 11px 16px; background: var(--accent); color: var(--accent-fg); cursor: pointer; min-height: 44px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn-ghost { background: var(--surface-2); color: var(--fg); }
.btn-small { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn-link { background: none; color: var(--accent); padding: 4px 0; min-height: 0; text-decoration: underline; text-underline-offset: 3px; justify-self: start; }
.icon-btn { font: 500 13px var(--f-body); background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 4px 8px; cursor: pointer; }
.icon-btn:disabled { opacity: .35; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
input, select, textarea { font: 16px var(--f-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; width: 100%; box-sizing: border-box; }
input[type="checkbox"], input[type="radio"] { width: 20px; height: 20px; accent-color: var(--accent); padding: 0; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; }
legend { font-family: var(--f-display); font-weight: 600; font-size: 15px; padding: 0; margin-bottom: 8px; color: var(--fg); }
.settings { gap: 22px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 400px) { .grid3 { grid-template-columns: 1fr 1fr; } }
.seg { display: grid; gap: 6px; }
.seg label { display: flex; align-items: center; gap: 8px; color: var(--fg); font-size: 15px; }
.fx-row { display: grid; grid-template-columns: 1fr 110px auto; gap: 8px; align-items: center; margin-bottom: 8px; }
.cat-head, .cat-row { display: grid; grid-template-columns: 1fr 88px 70px 64px; gap: 8px; align-items: center; }
.cat-row > span:first-child { font-size: 15px; }
.ord { display: flex; gap: 4px; }

.drop { display: grid; place-items: center; gap: 4px; padding: 28px 16px; border: 2px dashed var(--accent); border-radius: 18px; background: var(--accent-soft); cursor: pointer; text-align: center; }
.drop-title { font-family: var(--f-display); font-weight: 700; font-size: 20px; color: var(--accent); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.samples { display: grid; gap: 8px; }
.samples .btn { text-align: left; font-weight: 500; }
.status { color: var(--accent); font-weight: 600; min-height: 1.2em; }
.note { background: var(--warn-soft); color: var(--warn); padding: 10px 12px; border-radius: 10px; font-size: 14px; }
.remember { background: var(--accent-soft); color: var(--accent); padding: 10px 12px; border-radius: 10px; font-size: 14px; font-weight: 500; }
.first-note { background: var(--warn-soft); padding: 10px 12px; border-radius: 10px; color: var(--warn); font-weight: 600; }
.review { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }

.picks { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.picks > span { flex-basis: 100%; }
.pick-chip { font: 500 14px var(--f-body); background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; cursor: pointer; max-width: 100%; overflow-wrap: anywhere; text-align: left; }
.raw summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.raw pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; background: var(--surface-2); padding: 10px; border-radius: 8px; max-height: 240px; overflow: auto; }
.memo-line { font-size: 14px; color: var(--accent); font-weight: 500; }
.reason { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; font-size: 14px; }
.reason .muted { margin-right: 4px; }
.reason.conf-low { background: var(--warn-soft); }
.in { color: var(--accent); font-weight: 600; }
.rules summary { cursor: pointer; color: var(--accent); font-weight: 600; }
.rules ol { margin: 8px 0 0; padding-left: 22px; display: grid; gap: 8px; font-size: 14px; }
.rules .sub { display: block; overflow-wrap: anywhere; }
.tests { display: grid; gap: 6px; font-size: 14px; }
.tests span { font-weight: 600; display: inline-block; min-width: 56px; }
.tests .pass span { color: var(--accent); } .tests .fail span { color: var(--bad); }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); z-index: 5; }
.tabs-in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabs button { font: 600 14px var(--f-body); background: none; border: 0; color: var(--muted); padding: 14px 4px; cursor: pointer; border-top: 3px solid transparent; }
.tabs button[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
.btn-rec { background: #c4301c; border-color: #c4301c; color: #fff; }
.alert { border-left: 4px solid #c4601c; }

/* ---------- มือถือก่อน: การ์ด, ปุ่มใหญ่, พับรายละเอียด ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; display: grid; gap: 10px; }
.card h2 { font-size: 16px; }
details.more > summary, details.why > summary, details.sub-more > summary, details.raw > summary { cursor: pointer; list-style: none; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: center; min-height: 28px; }
details.more > summary::-webkit-details-marker, details.why > summary::-webkit-details-marker, details.sub-more > summary::-webkit-details-marker, details.raw > summary::-webkit-details-marker { display: none; }
details.more > summary::after, details.sub-more > summary::after, details.raw > summary::after { content: "▾"; color: var(--muted); transition: transform .2s; }
details[open].more > summary::after, details[open].sub-more > summary::after, details[open].raw > summary::after { transform: rotate(180deg); }
details.more[open] { gap: 10px; }
details.more > *:not(summary) { margin-top: 10px; }
details.why { background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
details.why > summary { font-weight: 500; color: var(--accent); }
details.why > summary::after { content: "Why? ▾"; font-size: 12.5px; white-space: nowrap; }
details.why[open] > summary::after { content: "Hide ▴"; }
details.why > *:not(summary) { margin-top: 8px; }
details.sub-more > summary { color: var(--muted); font-size: 14px; font-weight: 500; }
details.sub-more > *:not(summary) { margin-top: 8px; }
details.plan > summary { color: var(--accent); }
.ledger { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin: 0; font-size: 14.5px; }
.ledger dt { color: var(--muted); } .ledger dt.strong { color: var(--fg); } .ledger dd { margin: 0; text-align: right; }

.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile { display: grid; justify-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 4px 10px; cursor: pointer; font-family: var(--f-body); color: var(--fg); min-height: 88px; }
.tile.on { border: 2px solid var(--accent); background: var(--accent-soft); }
.tile-ic { font-size: 26px; line-height: 1.1; }
.tile-t { font-weight: 600; font-size: 14px; }
.tile-s { font-size: 11.5px; color: var(--muted); }
.panel { gap: 12px; }
.center { text-align: center; justify-self: center; }
.mic { justify-self: center; display: grid; place-items: center; width: 128px; height: 128px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-fg); font-size: 46px; cursor: pointer; box-shadow: 0 6px 18px rgba(10, 115, 92, .3); }
.mic.on { background: var(--bad); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 16px rgba(174, 55, 38, .15); } }
@media (prefers-reduced-motion: reduce) { .mic.on { animation: none; } }
.btn-big { min-height: 56px; font-size: 17px; }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg2 button { font: 600 15px var(--f-body); border: 0; border-radius: 9px; padding: 10px; background: none; color: var(--muted); cursor: pointer; min-height: 44px; }
.seg2 button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.amount-in { font-family: var(--f-display); font-size: 28px; font-weight: 700; }
.sticky-actions { position: sticky; bottom: calc(72px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; background: var(--surface); padding: 10px 0 2px; margin-top: 4px; }
.sticky-actions .btn { min-height: 50px; }
.tx-ic { font-size: 20px; width: 28px; flex-shrink: 0; text-align: center; }
.tx li { justify-content: flex-start; }
.tx li > div:not(.tx-r) { flex: 1; display: grid; min-width: 0; }
.tabs button { display: grid; justify-items: center; gap: 2px; padding: 8px 4px 10px; font-size: 12.5px; }
.tabs button span { font-size: 20px; line-height: 1.1; }
.tabs .tab-add span { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font-size: 22px; font-weight: 700; }
.alert { border-left: 4px solid var(--warn); }
@media (max-width: 360px) { .tile-s { display: none; } .tile { min-height: 72px; } }
.toast { position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -140%); width: min(92vw, 440px); background: var(--fg); color: var(--bg); border-radius: 14px; padding: 12px 16px; font-weight: 600; font-size: 15px; box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 20; transition: transform .3s; }
.toast.show { transform: translate(-50%, 0); }
.toast.in { background: var(--accent); color: var(--accent-fg); }
.toast.bad { background: var(--bad); color: #fff; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

/* ===================== ธีม "สมุดแผน" =====================
   กระดาษจุดแบบสมุดวางแผน + หมึกเขียวเข้ม + ปากกาเน้นข้อความสีเหลือง
   จุดเด่นเดียว: การ์ดงบวันนี้สีหมึก ตัวเลขสีปากกาเน้น และแถบงบแบ่งเป็นช่องแบบติ๊กในสมุด */
:root {
  --bg: #EEF3E4; --surface: #FFFFFF; --surface-2: #E8EEDC; --line: #DCE4CF;
  --fg: #161B14; --muted: #5E6A57; --accent: #161B14; --accent-fg: #FFFFFF; --accent-soft: #EAF6CC;
  --ink: #161B14; --ink-2: #242B21; --marker: #B8E643; --leaf: #3C7A16;
  --warn: #3F5C0B; --warn-soft: #E2F2B5; --bad: #C8402A; --bad-soft: #FBE2DC;
  --dot: rgba(22, 27, 20, .06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1511; --surface: #17211B; --surface-2: #212D26; --line: #2C3A32;
  --fg: #E8EEE9; --muted: #9AAAA1; --accent: #B8E643; --accent-fg: #161B14; --accent-soft: #2A3517;
  --ink: #0A110D; --ink-2: #16231C; --leaf: #5FCB8F; --warn: #CFEF7A; --warn-soft: #2A3517; --bad: #FF8A73; --bad-soft: #3E1C16;
  --dot: rgba(232, 238, 233, .07); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1511; --surface: #17211B; --surface-2: #212D26; --line: #2C3A32;
  --fg: #E8EEE9; --muted: #9AAAA1; --accent: #B8E643; --accent-fg: #161B14; --accent-soft: #2A3517;
  --ink: #0A110D; --ink-2: #16231C; --leaf: #5FCB8F; --warn: #CFEF7A; --warn-soft: #2A3517; --bad: #FF8A73; --bad-soft: #3E1C16;
  --dot: rgba(232, 238, 233, .07); color-scheme: dark; }

body { background-color: var(--bg); background-image: radial-gradient(var(--dot) 1.2px, transparent 1.3px); background-size: 22px 22px; }
.app { gap: 18px; padding-block: 14px calc(104px + env(safe-area-inset-bottom, 0px)); }
#view { gap: 18px; }

/* หัวแอป */
.top { align-items: center; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 20px; }
.brand::before { content: "M"; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 12px 12px 12px 4px; background: var(--ink); color: var(--marker); font-size: 20px; font-weight: 700; line-height: 1; }
.brand span { color: var(--muted); }

/* การ์ดงบวันนี้ */
.hero { background: var(--ink); color: #F1F5F2; border: 0; border-radius: 28px; padding: 20px 20px 18px; gap: 10px; }
.hero .eyebrow { color: #B9C7BE; font-weight: 500; font-size: 15px; letter-spacing: 0; }
.hero .big { color: var(--marker); font-size: clamp(56px, 19vw, 84px); letter-spacing: -.02em; }
.hero.is-over .big { color: #FF8A73; }
.hero .chip-warn { background: rgba(184, 230, 67, .16); color: var(--marker); }
.hero-meta { color: #B9C7BE; }
.hero .bar { position: relative; height: 14px; border-radius: 3px; background: rgba(255,255,255,.13); }
.hero .bar span { border-radius: 0; background: var(--marker); }
.hero .bar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 3px), var(--ink) calc(10% - 3px) 10%); }
.hero.is-over .bar span { background: #FF8A73; }
.hero details.why { background: var(--ink-2); color: #DCE5DF; }
.hero details.why > summary { color: #F1F5F2; }
.hero details.why > summary::after { color: var(--marker); }
.hero details.why .muted, .hero .cats .muted { color: #9FB0A6; }
.hero .cats .bar { background: rgba(255,255,255,.12); border-radius: 99px; height: 6px; }
.hero .cats .bar::after { display: none; }
.hero .cats .bar span { background: var(--marker); border-radius: 99px; }
.hero .cats .bar.over span, .hero .bad { color: #FF8A73; }
.hero .cats .bar.over span { background: #FF8A73; }
.hero .btn-ghost { background: var(--ink-2); color: var(--marker); }

/* ปุ่มเพิ่มรายการแบบวงกลม */
.tiles { gap: 6px; }
.tile { background: none; border: 0; padding: 4px 0; min-height: 0; gap: 6px; color: var(--fg); }
.tile-ic { display: grid; place-items: center; width: 60px; height: 60px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); color: var(--ink); transition: background .15s, transform .15s; }
.tile-ic svg { width: 26px; height: 26px; }
.tile:active .tile-ic { transform: scale(.94); }
.tile.on { background: none; border: 0; }
.tile.on .tile-ic { background: var(--marker); border-color: var(--marker); color: #161B14; }
.tile-t { font-size: 14px; }
.tile-s { font-size: 12px; }
